name: release-ghcr

on:
  push:
    tags: [v*]
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare
        id: prepare
        run: |
          REF=${{ github.ref }}
          REF=${REF#refs/tags/}
          REF=${REF#refs/heads/}
          echo "ref=ghcr.io/${{ github.repository }}:${REF}" >> $GITHUB_OUTPUT
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ steps.prepare.outputs.ref }}
          push: true
      - name: Clear
        if: always()
        run: |
          rm -f ${HOME}/.docker/config.json
